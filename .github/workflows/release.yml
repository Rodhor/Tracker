name: Release

# Triggers on any tag starting with "v" (e.g. v1.0.0, v0.3.1)
# To create a release: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

# Required so the action can create a release and upload assets
permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # if one platform fails, the others keep going
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: macos-latest   # arm64 (Apple Silicon) — macos-latest is arm64 since 2024
            target: aarch64-apple-darwin

          - os: macos-14       # last Intel-capable macOS runner (macos-13 was retired April 2026)
            target: x86_64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      # dtolnay/rust-toolchain is the current community standard.
      # actions-rs/toolchain is deprecated and will fail on current runners.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches compiled dependencies between runs — dramatically speeds up subsequent builds.
      # Swatinem/rust-cache handles the macOS cache-corruption bug in actions/cache automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # iced (via winit) requires these system libraries to compile on Linux.
      # This is a build-time requirement, not just runtime.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -qq update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev

      # Without this, the Windows binary requires the Visual C++ Redistributable
      # to be installed on the user's machine. Linking the CRT statically avoids that.
      - name: Configure static CRT linkage (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-pc-windows-msvc]\nrustflags = ["-Ctarget-feature=+crt-static"]\n' \
            >> .cargo/config.toml

      # Builds in release mode, archives the binary (.tar.gz on Unix, .zip on Windows),
      # generates a sha256 checksum, and uploads everything to the GitHub release
      # created by the tag push.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tracker
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
